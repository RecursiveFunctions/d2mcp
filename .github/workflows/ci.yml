name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/d2mcp ./cmd
      - name: Verify generated adapters
        run: go run ./cmd/generate-adapters -check

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/package-lock.json
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: d2mcp-vsix
          path: integrations/vscode/*.vsix
          if-no-files-found: error
