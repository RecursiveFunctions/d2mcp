name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          server_version="$(jq -r '.version' server.json)"
          image_version="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json | awk -F: '{print $NF}')"
          binary_version="$(sed -n 's/^[[:space:]]*ServerVersion = "\([^"]*\)"/\1/p' cmd/main.go)"
          test "$tag_version" = "$server_version"
          test "$tag_version" = "$image_version"
          test "$tag_version" = "$binary_version"
          echo "value=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test -race ./...

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/recursivefunctions/d2mcp:${{ steps.version.outputs.value }}
          labels: |
            io.modelcontextprotocol.server.name=io.github.recursivefunctions/d2mcp
          provenance: mode=max
          sbom: true

      - name: Install MCP publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json